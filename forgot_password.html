{% extends 'base.html' %}

{% block title %}Forgot Password | TravelReady AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                
                <div class="text-center mb-4">
                    <div class="brand-logo-badge mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                        <i class="bi bi-key-fill"></i>
                    </div>
                    <h3 class="fw-bold text-navy mb-1">Reset Password</h3>
                    <p class="text-secondary small">Enter your registered email address to receive password reset assistance</p>
                </div>

                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-sky w-100 py-2 rounded-pill fw-semibold text-white mt-2">
                        <i class="bi bi-send-check me-1"></i> Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-secondary">
                    Remember your credentials? <a href="{{ url_for('login') }}" class="text-sky fw-bold text-decoration-none">Back to Login</a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
