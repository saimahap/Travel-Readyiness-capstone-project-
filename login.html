{% extends 'base.html' %}

{% block title %}Login | TravelReady AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                
                <div class="text-center mb-4">
                    <div class="brand-logo-badge mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
                        <i class="bi bi-airplane-engines-fill"></i>
                    </div>
                    <h3 class="fw-bold text-navy mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Sign in to your TravelReady AI account to manage assessments</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                            <a href="{{ url_for('forgot_password') }}" class="text-sky small text-decoration-none">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-sky w-100 py-2 rounded-pill fw-semibold text-white mt-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-secondary">
                    Don't have an account yet? <a href="{{ url_for('register') }}" class="text-sky fw-bold text-decoration-none">Sign Up here</a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
